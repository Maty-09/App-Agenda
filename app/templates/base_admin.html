<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Norem Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (localStorage.getItem('noren_theme') === 'dark' || (!('noren_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], }
                }
            }
        }
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('noren_theme', isDark ? 'dark' : 'light');
            updateThemeToggleIcons();
        }
        function updateThemeToggleIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
                btn.innerHTML = isDark 
                    ? '<i class="fas fa-sun text-amber-400 text-sm"></i>' 
                    : '<i class="fas fa-moon text-slate-600 text-sm"></i>';
                btn.setAttribute('title', isDark ? 'Modo claro' : 'Modo oscuro');
            });
        }
        document.addEventListener('DOMContentLoaded', updateThemeToggleIcons);
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#f8fafc] dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 antialiased font-sans min-h-screen transition-colors duration-200">
    {% include "partials/_navbar.html" %}
    <main class="max-w-7xl mx-auto p-4 md:p-8">
        {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
