<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Norem - Nueva contraseña</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 p-4 font-[Inter] text-slate-900 flex items-center justify-center"><main class="w-full max-w-md overflow-hidden rounded-2xl border border-slate-100 bg-white shadow-xl"><div class="bg-gradient-to-br from-[#0b3d91] to-[#0755bf] p-8 text-center text-white"><div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-white text-2xl font-extrabold text-[#0755bf]">N</div><h1 class="mt-4 text-xl font-extrabold tracking-[.25em]">NOREM</h1></div><div class="p-8"><h2 class="text-2xl font-extrabold">Crea una nueva contraseña</h2><p class="mt-2 text-sm leading-6 text-slate-500">Usa al menos 8 caracteres para proteger tu cuenta.</p>{% if error %}<div class="mt-5 rounded-xl border border-red-100 bg-red-50 p-4 text-sm text-red-700">{{ error }}</div>{% endif %}<form method="post" action="/admin/reset-password" class="mt-7 space-y-5"><input type="hidden" name="token" value="{{ token }}"><div><label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-700">Nueva contraseña</label><input type="password" name="password" required minlength="8" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"></div><div><label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-700">Repite la contraseña</label><input type="password" name="password_confirm" required minlength="8" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"></div><button class="w-full rounded-xl bg-[#0755bf] px-4 py-3 text-sm font-bold text-white shadow-md transition hover:bg-[#0b3d91]">Guardar nueva contraseña</button></form><a href="/admin/login" class="mt-6 block text-center text-sm font-semibold text-blue-700 hover:text-blue-900">← Volver a iniciar sesión</a></div></main></body></html>
