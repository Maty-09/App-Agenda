{% macro logo(size='md', variant='light') %}
{% set text_sizes = {'sm': 'text-base', 'md': 'text-xl', 'lg': 'text-2xl'} %}
{% set text_color = 'text-white' if variant == 'dark' else 'text-slate-900' %}
{% if size == 'sm' %}
<div class="flex items-center gap-2.5" aria-label="Norem">
    <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-[#0b55c5] to-[#07347d] text-lg font-black italic text-white shadow-md shadow-blue-700/20 shrink-0 ring-1 ring-blue-400/30" aria-hidden="true">
        N
    </span>
    <span class="{{ text_sizes[size] }} font-extrabold {{ text_color }} tracking-[-0.03em]">Norem</span>
</div>
{% else %}
<div class="flex flex-col items-center gap-2" aria-label="Norem">
    <img src="/static/norem-logo.png" alt="Norem" class="{% if size == 'lg' %}w-40{% elif size == 'md' %}w-28{% else %}w-20{% endif %} h-auto">
</div>
{% endif %}
{% endmacro %}
